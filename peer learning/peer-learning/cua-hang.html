<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng – Học Cùng Bạn</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/chung.css">
  <link rel="stylesheet" href="css/cua-hang.css">
  <script src="assets/peer-assets.js"></script>
  <script type="module" src="js/cua-hang.js"></script>
</head>
<body>
  <a class="skip-link" href="#noi-dung">Bỏ qua, tới nội dung chính</a>
  <header id="site-header" class="site-header"></header>
  <main id="noi-dung" tabindex="-1">
    <div class="ch-dau">
      <div>
        <h1>Cửa hàng</h1>
        <p class="muted" id="ch-mo-ta">Đổi điểm chăm chỉ lấy bàn học, phụ kiện và màu tóc mới.</p>
      </div>
      <p class="ch-vi" aria-live="polite"><span aria-hidden="true">⭐</span> <b id="ch-diem">0</b> <span>điểm chăm chỉ</span></p>
    </div>
    <div class="tabs ch-tabs" role="tablist" aria-label="Các quầy trong cửa hàng">
      <button role="tab" id="t-ban" aria-controls="q-ban" aria-selected="true"><i class="fas fa-table" aria-hidden="true"></i> Bàn học</button>
      <button role="tab" id="t-phuKien" aria-controls="q-phuKien" aria-selected="false" tabindex="-1"><i class="fas fa-glasses" aria-hidden="true"></i> Phụ kiện</button>
      <button role="tab" id="t-mauToc" aria-controls="q-mauToc" aria-selected="false" tabindex="-1"><i class="fas fa-palette" aria-hidden="true"></i> Màu tóc</button>
    </div>
    <section class="ch-quay" id="q-ban" role="tabpanel" aria-labelledby="t-ban"></section>
    <section class="ch-quay" id="q-phuKien" role="tabpanel" aria-labelledby="t-phuKien" hidden></section>
    <section class="ch-quay" id="q-mauToc" role="tabpanel" aria-labelledby="t-mauToc" hidden></section>
  </main>
</body>
</html>
